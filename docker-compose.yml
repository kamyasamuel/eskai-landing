services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    environment:
      - DOCKER_BUILDKIT=1
      # Passed through explicitly rather than via env_file: .env sets DB_PATH to
      # a relative path, which would override the container's /app/data/eskai.db.
      - JWT_SECRET=${JWT_SECRET:-}
      - SEED_TOKEN=${SEED_TOKEN:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://eskai.eskaen.com}
    image: eskai-landing:latest
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      # PERSISTENCE: the SQLite database (early-access applications, page_views,
      # events, api_keys, admin_users) lives at /app/data/eskai.db inside the
      # container. The named volume below keeps it safe across rebuilds and
      # container recreation (`docker compose up -d --build` no longer wipes data).
      - eskai-landing_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  eskai-landing_data:
    name: eskai-landing_data
